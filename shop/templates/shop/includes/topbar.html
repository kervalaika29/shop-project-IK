{% load static %}
<!-- Topbar Start -->
<div class="container-fluid px-5 d-none border-bottom d-lg-block">
    <div class="row gx-0 align-items-center">
        <div class="col-lg-4 text-center text-lg-start mb-lg-0">
            <div class="d-inline-flex align-items-center" style="height: 45px;">
                <a href="{% url 'contact' %}" class="text-muted me-2"> Help</a><small> / </small>
                <a href="{% url 'contact' %}" class="text-muted mx-2"> Support</a><small> / </small>
                <a href="{% url 'contact' %}" class="text-muted ms-2"> Contact</a>
            </div>
        </div>
        <div class="col-lg-4 text-center d-flex align-items-center justify-content-center">
            <small class="text-dark">Call Us:</small>
            <a href="#" class="text-muted">(+012) 1234 567890</a>
        </div>
        <div class="col-lg-4 text-center text-lg-end">
            <div class="d-inline-flex align-items-center" style="height: 45px;">
                <a href="{% url 'admin:index' %}" class="text-muted"><small><i class="fa fa-home me-2"></i> Admin Panel</small></a>
            </div>
        </div>
    </div>
</div>
<div class="container-fluid px-5 py-4 d-none d-lg-block">
    <div class="row gx-0 align-items-center text-center">
        <div class="col-md-4 col-lg-3 text-center text-lg-start">
            <div class="d-inline-flex align-items-center">
                <a href="{% url 'home' %}" class="navbar-brand p-0">
                    <h1 class="display-5 text-primary m-0"><i class="fas fa-shopping-bag text-secondary me-2"></i>Mini Shop</h1>
                </a>
            </div>
        </div>
        <div class="col-md-4 col-lg-6 text-center">
            {# ძიება: ფორმა GET-ით აგზავნის ?q=...&category=... მთავარ გვერდზე #}
            <form action="{% url 'home' %}" method="get" class="position-relative ps-4">
                <div class="d-flex border rounded-pill">
                    <input class="form-control border-0 rounded-pill w-100 py-3" type="text" name="q" value="{{ query|default:'' }}" placeholder="Search products by name">
                    <select name="category" class="form-select text-dark border-0 border-start rounded-0 p-3" style="width: 200px;">
                        <option value="">All Category</option>
                        {% for category in categories %}
                            <option value="{{ category.pk }}" {% if category.pk == selected_category %}selected{% endif %}>{{ category.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="btn btn-primary rounded-pill py-3 px-5" style="border: 0;"><i class="fas fa-search"></i></button>
                </div>
            </form>
        </div>
        <div class="col-md-4 col-lg-3 text-center text-lg-end">
            <div class="d-inline-flex align-items-center">
                <a href="{% url 'sale' %}" title="Sale" class="text-muted d-flex align-items-center justify-content-center me-3"><span class="rounded-circle btn-md-square border"><i class="fas fa-tags"></i></span></a>
                <a href="{% url 'product_create' %}" title="Add product" class="text-muted d-flex align-items-center justify-content-center me-3"><span class="rounded-circle btn-md-square border"><i class="fas fa-plus"></i></span></a>
                <a href="{% url 'cart' %}" title="Cart" class="text-muted d-flex align-items-center justify-content-center"><span class="rounded-circle btn-md-square border"><i class="fas fa-shopping-cart"></i></span></a>
            </div>
        </div>
    </div>
</div>
<!-- Topbar End -->
