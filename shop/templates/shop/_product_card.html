<article class="card">
    <a class="card-link" href="{% url 'product_detail' product.pk %}">
        <div class="thumb">
            <span class="thumb-letter">{{ product.name|slice:":1"|upper }}</span>
            {% if product.has_discount %}<span class="badge-sale">SALE</span>{% endif %}
        </div>
        <div class="card-body">
            <span class="card-category">{{ product.category.name }}</span>
            <h3 class="card-title">{{ product.name }}</h3>
            <div class="card-price">{{ product.price }} ₾</div>
        </div>
    </a>
</article>
